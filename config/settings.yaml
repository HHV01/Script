llm:
  reasoning_effort: low
  model: deepseek-v4-pro
script:
  words_per_minute: 160
  dedupe_threshold: 0.85
review:
  enabled: true
  model: null
  min_score: 7
  max_revisions: 2
  max_sentence_words: 50
  recent_days: 30
  research_max_age_hours: 24
voice:
  provider: vieneu
  vieneu:
    mode: v3turbo
    voice: Hải Đăng
    ref_audio: ''
    precision: null
    gap_seconds: 0.3
  whisper:
    model: small
    language: vi
scenes:
  min_seconds: 4
  max_seconds: 8
  strategy: semantic_sentence
prompts:
  batch_size: 20
flow:
  backend: playwright
  playwright:
    use_environment_proxy: true
    headless: false
    cdp_url: ''
    profile_dir: .flow-profile
    executable_path: ''
    startup_timeout: 60
    navigation_timeout: 60
    readiness_timeout: 60
    debug_artifacts: false
  port: 8765
  token: ''
  delay_seconds:
  - 1
  - 2
  retries: 2
  submit_timeout: 180
  pick: first
render:
  width: 1920
  height: 1080
  fps: 30
  ken_burns: true
  burn_subtitles: true
  subtitle_font_size: 10
  subtitle_margin_bottom: 8
youtube:
  channel_handle: '@LsDấuVếtVănMinh'
  research: false
  region: VN
  language: vi
  max_results: 5
manager:
  enabled: false
  auto_dispatch: false
  interval_hours: 24
  minutes: 15
  flow_url: ''
  niche_seeds:
  - Cảm giác và phản ứng cơ thể đời thường
  - Trí nhớ và sự chú ý
  - Hành vi đời thường giải thích bằng khoa học
qc:
  min_duration_seconds: 60
  max_duration_seconds: 3600
