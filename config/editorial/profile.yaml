channel: Dấu Vết Văn Minh
reference: examples/sticker-direction.txt
approval_scope: Chủ repo xác nhận niche khoa học cơ thể/cảm giác/hành vi, bối cảnh
  và hình thức stick-orange hiện tại ngày 30/10/2026. Đây là chốt định hướng; không
  phải duyệt kịch bản, cơ chế khoa học hoặc chất lượng của bất kỳ video cụ thể nào.
voice:
  address: bạn; mình khi tự trào
  tone: tò mò, gần gũi, hài thông minh, kháy nhẹ tình huống; không chế giễu khán giả
structure:
- Long mở bằng một tình huống đời thường cụ thể và điều trái kỳ vọng; đặt một câu
  hỏi trung tâm có thể trả lời.
- 'Xác định điều đang giải thích: cảm giác, trí nhớ hay hành vi nào; phân biệt những
  khái niệm dễ bị nhập làm một.'
- Mỗi phần nối từ câu hỏi trước theo quan hệ nguyên nhân hoặc bằng chứng; không liệt
  kê các sự thật rời rạc.
- Một nhịp gồm quan sát → giải thích có nguồn → ví dụ trực quan → hệ quả; ví dụ minh
  họa không thay thế bằng chứng.
- 'Nêu giới hạn ngay cạnh luận điểm: tương quan, giả thuyết, thí nghiệm trên động
  vật hoặc mẫu nhỏ phải gọi đúng tên.'
- Kết trả lời câu hỏi mở, quay lại tình huống ban đầu với hiểu biết mới; không đưa
  lời hứa chưa giải quyết vào CTA.
historical_care:
- Tên trường giữ tương thích dữ liệu; tiêu chí kiểm chứng khoa học.
- Phân biệt quan sát, kết quả nghiên cứu, diễn giải và điều chưa biết; không biến
  tương quan thành nhân quả.
- Không bịa cơ chế sinh học cho miếng hài; không suy từ động vật sang người hoặc từ
  trung bình nhóm sang mọi cá nhân.
- Không chẩn đoán khán giả, gán bệnh, phán tính cách hay củng cố định kiến từ một
  hành vi đời thường.
- Nguồn phải khớp luận điểm và đã được đọc; video đối thủ, ví dụ kể chuyện và mẫu
  văn phong không là bằng chứng khoa học.
- Tranh luận còn mở phải nêu mức chắc chắn; không dùng một bài báo để tuyên bố đã
  có lời giải duy nhất.
narration:
- Thông tin làm nền → liên tưởng đời thường → miếng hài ngắn → trở lại giải thích;
  không ép tần suất hài hoặc nhét slang.
- Ưu tiên câu ngắn/vừa, nhịp đọc tự nhiên; xuống đoạn khi đổi ý, không cắt câu máy
  móc theo số từ.
- 'Ẩn dụ phải có ranh giới rõ: não không thật sự là ổ cứng, người gác cổng hoặc nhân
  vật có ý định.'
- Không lặp lại hook bằng nhiều ví dụ trước khi bắt đầu trả lời; mỗi đoạn phải thêm
  thông tin hoặc đổi cách hiểu.
- Thuật ngữ được giải nghĩa trước khi dùng tiếp; số liệu, tên riêng và viết tắt có
  hướng dẫn đọc khi cần.
length: Ưu tiên long ngang 16:9; thời lượng theo lượng thông tin có ích và yêu cầu
  project. Không kéo dài để đủ phút, không coi bản 15 phút hiện có là chuẩn bắt buộc.
editorial_handoff:
  executor: /root/science_editorial
  role_label: Biên tập khoa học; nhãn công việc của agent, không phải một con người
  scope: Cập nhật hướng dẫn biên tập và tài liệu bàn giao; chưa duyệt sản phẩm
  approval_status: direction_only_no_product_approval
  character_id: stick-orange
