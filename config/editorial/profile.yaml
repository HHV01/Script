channel: "Dấu Vết Văn Minh"
reference: "examples/giza.approved.txt"
approval_scope: "Chủ kênh cung cấp làm mẫu kịch bản đã duyệt; không phải xác nhận mọi dữ kiện là đúng hoặc còn cập nhật."
voice:
  address: "mình và bạn; chúng ta"
  tone: "điềm tĩnh, tò mò, giàu hình ảnh, dễ hiểu, tôn trọng bằng chứng"
structure:
  - "Mở bằng một cảnh cụ thể có thể hình dung, dẫn dần đến câu hỏi trung tâm; không ép hook phải là câu hỏi ở giây đầu."
  - "Đi theo các manh mối có tên/người/địa điểm cụ thể; giải thích cơ chế bằng ví dụ đời thường."
  - "Chuyển ý bằng câu hỏi tự nhiên; mỗi phần trả lời một câu rồi mở câu tiếp theo."
  - "Gài lời hứa có payoff ở đoạn sau; không cường điệu bí ẩn hay tạo thông tin giả."
  - "Kết nối các manh mối thành bức tranh chung; kết bằng câu hỏi lựa chọn cụ thể và lời mời đăng ký nhẹ."
historical_care:
  - "Nói rõ giới hạn bằng chứng: manh mối không phải lời giải toàn bộ; phát hiện khác nhau không được nhập thành một."
  - "Phân biệt điều quan sát được, suy luận của nhà nghiên cứu và điều chưa biết."
  - "Không biến khoảng trống kiến thức thành bằng chứng về kho báu, siêu nhiên hay người ngoài hành tinh."
  - "Mẫu chỉ dùng học cách kể, không dùng làm nguồn kiểm chứng các con số, niên đại hay phát hiện mới."
narration:
  - "Đa số câu ngắn/vừa, thường 10–25 đơn vị tách bằng khoảng trắng; xen câu nhấn rất ngắn."
  - "Cho phép câu dẫn cảnh dài hơn khi nhịp ngắt tự nhiên; mẫu có 4/182 câu trên 35 từ, tối đa 48."
  - "Mỗi ý/nhịp thường xuống đoạn; điệp cấu trúc ngắn có dụng ý được phép, không coi mọi điệp nhịp là lỗi lặp."
  - "Tên riêng, thuật ngữ cần chú giải cách đọc trong hướng dẫn thu; năm/số/viết tắt phải đọc rõ."
length: "Giữ thời lượng project yêu cầu; không bắt mọi video dài bằng mẫu 3032 đơn vị tách khoảng trắng."
