id: stick-orange
name: Người que cam-nâu mắt tròn
role: Nhân vật minh họa chính của kênh "khoa học về chính bạn"; người que biểu cảm, tự trào nhẹ, không đại diện người thật.
vibe:
  tone: tò mò, tự trào, dí dỏm bằng tình huống; không la hét hoặc giả vờ sốc
  hook: đồ vật hoặc hành động cụ thể gợi câu hỏi ngay; giải đáp trong cùng video
  avoid: nhái nhân vật thương hiệu khác, biểu cảm lặp vô nghĩa, giật gân và kéo dài
visual: 'Hand-drawn stick figure sketched with a single charcoal pen: round warm-white head drawn with one loose circle taking up upper third of frame, two large round charcoal eyes as simple dots, short curved mouth as a single line, thin charcoal stick limbs drawn in one continuous motion, small rounded orange-brown torso as a loose oval filling center of frame, one tiny coral square badge with no symbol on LEFT chest. Character is LARGE and fills 60-70 percent of frame height. Slightly imperfect hand-drawn lines, organic wobble, paper texture. Expressive readable poses through simple body language, flat wash colors, no hair, no glasses, no human portrait. Large eyes for clear emotion. Warm orange-brown body on cream paper background with teal and coral accents.'
