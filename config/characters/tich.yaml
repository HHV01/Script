# BIBLE NHÂN VẬT — chỉnh lại cho đúng nhân vật thật của bạn.
id: tich
name: Tích
role: Người dẫn chuyện, xuất hiện trong các cảnh minh họa

# "Vibe" dùng khi viết kịch bản (bước 1)
vibe:
  tone: "tò mò, điềm tĩnh, hơi hài hước kiểu người kể chuyện lịch sử"
  pov: "ngôi thứ nhất số nhiều ('chúng ta') khi dẫn dắt, ngôi thứ ba khi kể sự kiện"
  hook: "mở bằng một cảnh cụ thể gợi tò mò, dẫn tự nhiên đến câu hỏi trung tâm theo mẫu chủ kênh"
  ending: "kết bằng một câu hỏi để người xem bình luận"
  avoid: "lặp ý không thêm giá trị, sáo rỗng, giảng đạo, câu dài thiếu điểm ngắt tự nhiên"

# Mô tả ngoại hình CỐ ĐỊNH (tiếng Anh) — được chèn nguyên văn vào mọi prompt ảnh có Tích.
